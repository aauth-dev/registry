name = "registry-aauth-dev"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# Opt in to the account-level Workers Trace Events Logpush job (forensic
# archive: R2 bucket cloudflare-managed-3941311c, WEUR). Per-worker opt-in
# is required — without this the account job ignores the worker.
logpush = true

[vars]
ORIGIN = "https://registry.aauth.dev"

# Human web UI: static assets in public/ (index.html + bundled registry.js,
# built by `npm run build:client`). Assets are served first; unmatched paths
# fall through to the Worker (the API + well-known routes).
[assets]
directory = "public"

# Source of truth: one key per resource (resource:{host} -> RegistryEntry).
[[kv_namespaces]]
binding = "REGISTRY_KV"
id = "beee1a48381940b88eb8b1185d893897"

# Denormalized read view: a single resources.json object rebuilt by reconcile.
[[r2_buckets]]
binding = "REGISTRY_R2"
bucket_name = "registry-aauth-dev"

[[routes]]
pattern = "registry.aauth.dev"
custom_domain = true

# Daily reconcile: rebuild resources.json from KV + refresh live metadata.
[triggers]
crons = ["0 0 * * *"]

# Structured telemetry events. shipper.aauth.dev consumes this queue,
# batches + signs (RFC 9421), and POSTs to Freezer /api/v1/ingest.
[[queues.producers]]
queue = "aauth-events"
binding = "EVENTS_QUEUE"

# Secrets (set via `wrangler secret put`):
#   SIGNING_KEY  — Ed25519 private JWK (npm run generate-key)
#
# Admin auth is AAuth-native, not a shared secret: POST /admin/reconcile
# requires an agent token issued by an agent provider (AP) in the KV
# allowlist at key `admin:providers` (a JSON string[] of agent-token `iss`
# URLs — any agent from a listed AP is authorized). Seed with:
#   wrangler kv key put --namespace-id <REGISTRY_KV id> --remote \
#     'admin:providers' '["https://dickhardt.github.io"]'
